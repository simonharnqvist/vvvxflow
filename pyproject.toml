[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vvvxflow"
version = "0.1.0"
description = "ETL pipeline for VVVX data"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pyspark", "tqdm"]

[tool.setuptools.packages.find]
where=["."]
include = ["vvvxflow*"]